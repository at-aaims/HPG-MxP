name: CPU tests (Ubunutu x86_64)
on: [pull_request]
jobs:
  build:
    name: Build and test HPG-MxP
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MPI library
        run: sudo apt-get update && sudo apt-get install -y mpich
      - name: Show runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          lspci | grep -i -E 'ethernet|infiniband|network' || true
          for d in /sys/class/infiniband/*; do echo "$d -> $(readlink -f $d/device/driver)"; done
      - name: Configure CMake project
        run: cmake -DHPGMP_ENABLE_MPI=On -DHPGMP_BUILD_REFERENCE=On -B ${{github.workspace}}/build
      - name: Build project
        run: cmake --build ${{github.workspace}}/build
      - name: Run tests with CTest
        # Remove UCX_TLS once the runner or the MPI package handles it.
        env:
          UCX_TLS: self,sm,tcp
        run: ctest --verbose --test-dir ${{github.workspace}}/build --output-on-failure
      - name: Configure half-precision matrix project
        run: cmake -DHPGMP_ENABLE_MPI=On -DHPGMP_BUILD_REFERENCE=On -DHPGMP_ENABLE_HALF=On -B ${{github.workspace}}/build_half
      - name: Build half-precision matrix project
        run: cmake --build ${{github.workspace}}/build_half
      - name: Run half-precision matrix tests with CTest
        env:
          UCX_TLS: self,sm,tcp
        run: ctest --verbose --test-dir ${{github.workspace}}/build_half --output-on-failure
